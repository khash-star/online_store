<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Туслах</title>
</head>
<body>
    <h1>AI Туслах</h1>
    <textarea id="userInput" rows="4" cols="50" placeholder="Та асуултаа энд бичнэ үү"></textarea>
    <br>
    <button id="askButton">Асуух</button>
    <p id="response">Хариулт энд гарна</p>

    <script>
        document.getElementById("askButton").addEventListener("click", async () => {
            const userInput = document.getElementById("userInput").value;
            const responseField = document.getElementById("response");

            responseField.textContent = "Хариулт боловсруулж байна...";
            
            try {
                const res = await fetch("http://127.0.0.1:5000/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ prompt: userInput }),
                });

                const data = await res.json();
                if (data.response) {
                    responseField.textContent = data.response;
                } else {
                    responseField.textContent = "Алдаа гарлаа: " + (data.error || "Тодорхойгүй алдаа");
                }
            } catch (err) {
                responseField.textContent = "Сервертэй холбогдоход алдаа гарлаа.";
            }
        });
    </script>
</body>
</html>
